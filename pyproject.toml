[project]
name = "s6-lab-serverless"
version = "0.3.1"
requires-python = ">=3.11"
dependencies = [
    # --- base ---
    "jsonschema==4.26.0",
    "numpy==2.4.4",
    "pandas==3.0.2",
    "pyarrow==23.0.1",
    "python-dateutil==2.9.0.post0",
    "pyyaml==6.0.3",
    "sqlalchemy==2.0.49",
    # --- local ---
    "duckdb==1.5.2",
    "fastexcel==0.20.2",
    "great-expectations==1.17.1; python_version < \"3.14\"",
    "openpyxl==3.1.5",
    "pathspec==1.1.1",
    "polars==1.40.1",
    "psycopg2-binary==2.9.12",
    "pyinstaller==6.20.0",
    "pyside6==6.11.0",
    "setuptools==82.0.1",
    "wheel==0.45.1",
    "xlsxwriter==3.2.9",
    # --- cloud ---
    "awswrangler==3.16.0",
    "boto3==1.35.49",
    "python-dotenv==1.2.2",
    "python-jose[cryptography]==3.5.0",
    "truststore==0.10.4",
]

[dependency-groups]
dev = [
    "faker==40.15.0",
    "httpx==0.28.1",
    "hypothesis==6.152.4",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "ruff==0.15.12",
]

[tool.pytest.ini_options]
markers = [
    "cloud: tests that require live AWS credentials (skipped without them)",
]

[tool.uv]
package = false
